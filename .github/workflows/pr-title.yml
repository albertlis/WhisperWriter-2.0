name: PR title

# pull_request (not pull_request_target): the action only reads the title,
# so no write token is needed, and pull_request_target is blocked by default
# on public repos from 2026-12-02.
on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  validate-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
